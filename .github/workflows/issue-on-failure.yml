name: Create Issue on Failure

on:
  workflow_run:
    workflows: ["CI", "Build & Push Docker Image", "Deploy"]
    types: [completed]

jobs:
  create-issue:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: LMCustoms/.github/.github/workflows/issue-on-failure.yml@main
    permissions:
      issues: write
